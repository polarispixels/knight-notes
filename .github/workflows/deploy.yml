name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vue-tsc -b
      - run: npx vite build --base=/knight-notes/
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so
      # deep links like /study/opera-game keep working on refresh.
      - run: cp dist/index.html dist/404.html
      # Publish the documentation set at /docs/ so external agents can
      # orient from one public URL, always in sync with the deploy.
      - run: |
          cp CONTENT_AUTHORING.md dist/docs/CONTENT_AUTHORING.md
          cp AGENT_GUIDE.md dist/docs/AGENT_GUIDE.md
          cp README.md dist/docs/README.md
          cp DESIGN_SPEC.md dist/docs/DESIGN_SPEC.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
